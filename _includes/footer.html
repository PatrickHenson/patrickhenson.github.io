<footer class="site-footer">
  {%- assign sorted_tags = site.tags | sort -%}
  {%- if sorted_tags.size > 0 -%}
  <div class="footer-tags">
    <span class="footer-label">Browse by topic</span>
    {%- for tag in sorted_tags -%}
      <a href="{{ "/tag/" | append: tag.first | relative_url }}">{{ tag.first }}</a>{%- unless forloop.last -%}<span class="dot">&middot;</span>{%- endunless -%}
    {%- endfor -%}
  </div>
  {%- endif -%}

  <div class="footer-colophon">
    &copy; {{ site.time | date: "%Y" }} <a href="mailto:{{ site.email }}">{{ site.author }}</a> &middot; built with <a href="https://jekyllrb.com">Jekyll</a>
  </div>
</footer>
